name: pashumauli
description: PashuMauli — Offline-first livestock health surveillance platform (SIH 26128)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local database
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Secure storage for JWT
  flutter_secure_storage: ^9.2.2

  # HTTP client
  http: ^1.2.2

  # Location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Media / Camera
  image_picker: ^1.1.2

  # UUID generation
  uuid: ^4.5.1

  # TFLite adapter dependency (stub for Phase 5)
  # tflite_flutter: ^0.10.4  # Uncomment when Phase 5 begins and model file is bundled

  # Connectivity
  connectivity_plus: ^6.1.1

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Shared preferences for language persistence
  shared_preferences: ^2.3.4

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.13
  mockito: ^5.4.4
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/models/

  fonts: []
