services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: pashumauli_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pashu
      POSTGRES_PASSWORD: pashu
      POSTGRES_DB: pashumauli
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pashu -d pashumauli"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pashumauli_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
